name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # docker/build-push-action uploads a build-record artifact for every image
  # build. The job summary still reports the build; skip the artifact.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Playwright's --with-deps step downloads and installs OS packages; slow
    # hosted-runner apt mirrors can take several minutes before E2E starts.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The lint gate compares the complete PR with its merge base. A
          # shallow two-commit checkout lets an earlier commit in a multi-
          # commit branch escape the diff and makes the gate non-deterministic.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint and type-check frontend
        run: npm run lint
      - name: Type-check and build frontend
        run: npm run build
      - name: Ensure frontend build leaves no TypeScript artifacts
        run: |
          for artifact in vite.config.js vite.config.d.ts tsconfig.tsbuildinfo tsconfig.node.tsbuildinfo; do
            test ! -e "$artifact"
          done
      - name: Frontend unit tests
        env:
          EDGEWATCH_REPORT_ACT_WARNINGS: '1'
        run: npm run test:coverage
      - name: Resolve diff coverage base
        id: frontend-diff-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Unable to resolve a diff-coverage base" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Frontend diff coverage
        run: node scripts/check-diff-coverage.mjs --language frontend --coverage coverage/coverage-final.json --base "${{ steps.frontend-diff-base.outputs.base }}" --require-base
      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          if-no-files-found: error
          # Coverage reports are diagnostics for this run; keep them briefly.
          retention-days: 14
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/index.html
      - name: Set up Go for real-stack browser tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go dependencies for real-stack browser tests
        run: go mod download
      - name: Remove stale Google Chrome apt source
        # Playwright installs Chromium and does not need the runner's Chrome repository.
        # Removing it avoids unrelated apt index hash mismatches during dependency setup.
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e

  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Set up Node for embedded assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Build embedded frontend assets
        run: npm ci && npm run build
      - name: Dependency and static-analysis checks
        env:
          GOLANGCI_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make security
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify schema documentation
        run: ./scripts/check-schema-docs.sh
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/edgewatch

  go-test:
    name: go-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The race-enabled store suite is the longest package, so its tests are
    # split round-robin across three shards; the other packages share a fourth
    # runner. Each shard takes about 4-6 minutes on a typical runner. Leave
    # room for runners that are twice as slow instead of failing on Go's
    # per-package timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [store-1, store-2, store-3, other]
    env:
      STORE_SHARDS: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for embedded assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.shard == 'other'
        with:
          node-version: 24.21.0
          cache: npm
      - name: Build embedded frontend assets
        if: matrix.shard == 'other'
        run: npm ci && npm run build
      - name: Select tests
        id: tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          store="github.com/crypt0rr/edgewatch/internal/store"
          case "$SHARD" in
            store-*)
              index="${SHARD#store-}"
              # Listing with the flags of the test run reuses its build.
              names="$(go test -race -coverprofile=coverage.out -list . "$store" | grep -E '^(Test|Example|Fuzz)' | sort |
                awk -v shards="$STORE_SHARDS" -v shard="$index" '(NR - 1) % shards == shard - 1')"
              if [ -z "$names" ]; then
                echo "shard $SHARD selected no tests" >&2
                exit 1
              fi
              echo "Running $(printf '%s\n' "$names" | wc -l) store tests"
              echo "packages=$store" >> "$GITHUB_OUTPUT"
              echo "run=^($(printf '%s\n' "$names" | paste -sd '|'))\$" >> "$GITHUB_OUTPUT"
              ;;
            other)
              echo "packages=$(go list ./... | grep -vxF "$store" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
              echo "run=" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "unknown shard: $SHARD" >&2; exit 1 ;;
          esac
      - name: Test
        env:
          PACKAGES: ${{ steps.tests.outputs.packages }}
          RUN: ${{ steps.tests.outputs.run }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # PACKAGES is a space-separated list.
          go test -race -timeout=20m -coverprofile=coverage.out -run "${RUN:-.}" $PACKAGES | tee go-coverage-summary.txt
      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          path: |
            coverage.out
            go-coverage-summary.txt

  # Branch protection requires this check. It fails unless the Go checks and
  # every test shard succeeded, then applies the coverage gates to the merged
  # profile of all shards.
  test:
    if: always()
    needs: [go-checks, go-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require Go checks and test shards
        env:
          CHECKS: ${{ needs.go-checks.result }}
          TESTS: ${{ needs.go-test.result }}
        run: |
          if [ "$CHECKS" != success ] || [ "$TESTS" != success ]; then
            echo "go-checks: $CHECKS, go-test: $TESTS" >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          path: shards
      - name: Merge shard coverage
        run: |
          set -euo pipefail
          for shard in store-1 store-2 store-3 other; do
            test -d "shards/go-coverage-$shard"
          done
          ./scripts/merge-go-coverage.sh coverage.out go-coverage-summary.txt shards/go-coverage-*
      - name: Check Go coverage
        run: ./scripts/check-go-coverage.sh coverage.out go-coverage-summary.txt
      - name: Resolve diff coverage base
        id: go-diff-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Unable to resolve a diff-coverage base" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Go diff coverage
        run: node scripts/check-diff-coverage.mjs --language go --coverage coverage.out --base "${{ steps.go-diff-base.outputs.base }}" --require-base
      - name: Upload Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          if-no-files-found: error
          # Coverage reports are diagnostics for this run; keep them briefly.
          retention-days: 14
          path: |
            coverage.out
            go-coverage-summary.txt

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for release-style inputs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for release-style inputs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Validate Compose deployment
        run: |
          ./scripts/verify-compose-policy.sh base
          ./scripts/verify-compose-policy.sh syn
          node --test scripts/verify-compose-policy.test.mjs
      - name: Verify pinned Naabu release
        run: ./scripts/verify-naabu-pin.sh
      - name: Verify release artifact contract
        run: ./scripts/test-release-artifacts.sh
      - name: Verify release workflow promotion contract
        run: node --test scripts/release-workflow.test.mjs
      - name: Build release-style prebuilt inputs
        run: |
          npm ci
          npm run build
          go mod download
          mkdir -p release-binaries/linux_amd64 release-binaries/linux_arm64
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w -X main.version=v0.0.0-ci' \
              -o "release-binaries/linux_${arch}/edgewatch" ./cmd/edgewatch
          done
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each image build keeps its BuildKit cache in its own scope so the
      # builds do not replace each other's cache. Only pushes to main save
      # cache: a pull request's cache is visible to that pull request alone,
      # so pull requests read main's cache without writing their own.
      - name: Build container for supported platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: edgewatch:test
          cache-from: type=gha,scope=container-multiarch
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=container-multiarch' || '' }}
      - name: Build prebuilt AMD64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: edgewatch:prebuilt-amd64
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=gha,scope=container-prebuilt-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=container-prebuilt-amd64' || '' }}
      - name: Verify prebuilt AMD64 image
        run: bash ./scripts/test-prebuilt-image.sh edgewatch:prebuilt-amd64 linux/amd64 v0.0.0-ci
      - name: Verify container runtime capability matrix
        run: ./scripts/verify-container-runtime.sh edgewatch:prebuilt-amd64
      - name: Verify scanner sandbox with real scans
        run: ./scripts/verify-scanner-sandbox.sh edgewatch:prebuilt-amd64
      - name: Build prebuilt ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: edgewatch:prebuilt-arm64
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=gha,scope=container-prebuilt-arm64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=container-prebuilt-arm64' || '' }}
      - name: Verify prebuilt ARM64 image
        run: bash ./scripts/test-prebuilt-image.sh edgewatch:prebuilt-arm64 linux/arm64 v0.0.0-ci

  # GitHub Actions caches are ref-isolated, so release tags cannot restore a
  # cache written by main. Seed separate main and release GHCR caches here;
  # tags refresh only the release cache. Grant package writes only to trusted
  # pushes or deliberate dispatches on main.
  release-cache:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for release-style inputs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for release-style inputs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Build release-style prebuilt inputs
        run: |
          npm ci
          npm run build
          go mod download
          mkdir -p release-binaries/linux_amd64 release-binaries/linux_arm64
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w -X main.version=v0.0.0-ci' \
              -o "release-binaries/linux_${arch}/edgewatch" ./cmd/edgewatch
          done
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx for cache export
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR for the release cache
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export release-style multi-platform cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: edgewatch:release-prebuilt-multiarch
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          # Seed the registry cache from the main-only per-architecture GHA
          # caches when the registry ref is new or needs invalidated layers.
          cache-from: |
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:buildcache
            type=gha,scope=container-prebuilt-amd64
            type=gha,scope=container-prebuilt-arm64
          cache-to: |
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:buildcache,mode=max
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:releasecache,mode=max
      # Read the just-exported ref on a clean worker to prove that both
      # architecture-specific Naabu compile results are in the registry cache.
      - name: Set up isolated Buildx for cache verification
        id: release-cache-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify release-style multi-platform cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.release-cache-builder.outputs.name }}
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: edgewatch:release-prebuilt-multiarch
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=registry,ref=ghcr.io/crypt0rr/edgewatch:releasecache
