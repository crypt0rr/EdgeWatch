name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The lint gate compares the complete PR with its merge base. A
          # shallow two-commit checkout lets an earlier commit in a multi-
          # commit branch escape the diff and makes the gate non-deterministic.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint and type-check frontend
        run: npm run lint
      - name: Type-check and build frontend
        run: npm run build
      - name: Ensure frontend build leaves no TypeScript artifacts
        run: |
          for artifact in vite.config.js vite.config.d.ts tsconfig.tsbuildinfo tsconfig.node.tsbuildinfo; do
            test ! -e "$artifact"
          done
      - name: Frontend unit tests
        env:
          EDGEWATCH_REPORT_ACT_WARNINGS: '1'
        run: npm run test:coverage
      - name: Resolve diff coverage base
        id: frontend-diff-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Frontend diff coverage
        run: node scripts/check-diff-coverage.mjs --language frontend --coverage coverage/coverage-final.json --base "${{ steps.frontend-diff-base.outputs.base }}"
      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          if-no-files-found: error
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/index.html
      - name: Set up Go for real-stack browser tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go dependencies for real-stack browser tests
        run: go mod download
      - name: Remove stale Google Chrome apt source
        # Playwright installs Chromium and does not need the runner's Chrome repository.
        # Removing it avoids unrelated apt index hash mismatches during dependency setup.
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e

  test:
    runs-on: ubuntu-latest
    # The race-enabled store suite migrates a fresh SQLite database for each
    # case. Keep the job bounded, but allow the Go package to use the same
    # headroom as the CI job instead of Go's 10-minute default timeout.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Set up Node for embedded assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Build embedded frontend assets
        run: npm ci && npm run build
      - name: Dependency and static-analysis checks
        env:
          GOLANGCI_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make security
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify schema documentation
        run: ./scripts/check-schema-docs.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test -race -timeout=15m -coverprofile=coverage.out ./... | tee go-coverage-summary.txt
      - name: Check Go coverage
        run: ./scripts/check-go-coverage.sh coverage.out go-coverage-summary.txt
      - name: Resolve diff coverage base
        id: go-diff-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Go diff coverage
        run: node scripts/check-diff-coverage.mjs --language go --coverage coverage.out --base "${{ steps.go-diff-base.outputs.base }}"
      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          if-no-files-found: error
          path: |
            coverage.out
            go-coverage-summary.txt
      - name: Build
        run: go build -trimpath ./cmd/edgewatch

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for release-style inputs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for release-style inputs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Validate Compose deployment
        run: |
          ./scripts/verify-compose-policy.sh base
          ./scripts/verify-compose-policy.sh syn
          node --test scripts/verify-compose-policy.test.mjs
      - name: Verify pinned Naabu release
        run: ./scripts/verify-naabu-pin.sh
      - name: Verify release artifact contract
        run: ./scripts/test-release-artifacts.sh
      - name: Build release-style prebuilt inputs
        run: |
          npm ci
          npm run build
          go mod download
          mkdir -p release-binaries/linux_amd64 release-binaries/linux_arm64
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w -X main.version=v0.0.0-ci' \
              -o "release-binaries/linux_${arch}/edgewatch" ./cmd/edgewatch
          done
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container for supported platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: edgewatch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build prebuilt AMD64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: edgewatch:prebuilt-amd64
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify prebuilt AMD64 image
        run: bash ./scripts/test-prebuilt-image.sh edgewatch:prebuilt-amd64 linux/amd64 v0.0.0-ci
      - name: Verify container runtime capability matrix
        run: ./scripts/verify-container-runtime.sh edgewatch:prebuilt-amd64
      - name: Build prebuilt ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: edgewatch:prebuilt-arm64
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify prebuilt ARM64 image
        run: bash ./scripts/test-prebuilt-image.sh edgewatch:prebuilt-arm64 linux/arm64 v0.0.0-ci
