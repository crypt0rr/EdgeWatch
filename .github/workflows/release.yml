name: Release

# Re-running a failed release
#
# Use "Re-run failed jobs" on the failed run; do not push the tag again. A
# partial re-run repeats only the failed jobs and the jobs that need them, and
# the smoke and promote-semver jobs read the candidate image from the output of
# the image job, which GitHub keeps from the attempt that built it. The re-run
# therefore continues with the image that was built and verified before:
# - smoke failed: the re-run verifies the same draft release and candidate
#   image, then publishes the release and promotes the image;
# - publish-release failed: the re-run publishes the draft and promotes the
#   image;
# - promote-semver failed after the release was published: the re-run creates
#   ghcr.io/crypt0rr/edgewatch:<version> from the candidate that smoke
#   verified, usually in the first attempt, and then moves latest. A semver
#   tag that already points to that candidate counts as promoted, and any
#   other existing semver tag is never overwritten;
# - promote-latest failed: the re-run moves latest to the semver image.
# A re-run of binaries or image downloads the release-candidate artifact of the
# verify job, so re-run those within its seven-day retention; GitHub allows
# re-runs for 30 days. "Re-run all jobs" builds and pushes a new candidate
# image, and the binaries job refuses it once the release is published; use it
# only for a run that stopped before the release was published.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker image references must be lowercase even though GitHub repository
  # names may contain uppercase characters.
  REGISTRY_IMAGE: ghcr.io/crypt0rr/edgewatch
  NODE_VERSION: 24.21.0
  GORELEASER_VERSION: v2.18.3
  # docker/build-push-action uploads a build-record artifact for every image
  # build. The job summary still reports the build; skip the artifact.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # This is the only job that builds frontend assets and EdgeWatch binaries.
  # Downstream publication jobs consume its immutable artifact instead of
  # silently rebuilding with a different toolchain or source tree.
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    # Runs the complete race-enabled Go suite; CI splits store tests across shards.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.3.0 or v0.3.0-rc.1"
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release verification runs the same complete-change security gate
          # as pull requests; retain history so the merge base is available.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Verify schema documentation
        run: ./scripts/check-schema-docs.sh
      - name: Verify pinned Naabu release
        run: ./scripts/verify-naabu-pin.sh
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies and lint
        run: npm ci && npm run lint
      - name: Build frontend assets
        run: npm run build
      - name: Resolve release lint comparison base
        id: release-lint-base
        run: |
          set -euo pipefail
          # Compare the whole release range with the previous verified tag.
          # Tag pushes do not provide a reliable github.event.before value;
          # resolving the parent tag locally covers every commit since the
          # last release without inheriting the repository's known baseline.
          base="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$base" ]]; then
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          base_commit="$(git rev-parse --verify "${base}^{commit}")"
          echo "base=$base_commit" >> "$GITHUB_OUTPUT"
      - name: Dependency and static-analysis checks
        env:
          GOLANGCI_LINT_BASE: ${{ steps.release-lint-base.outputs.base }}
        run: make security
      - name: Verify release workflow promotion contract
        run: node --test scripts/release-workflow.test.mjs
      - name: Ensure frontend build leaves no TypeScript artifacts
        run: |
          for artifact in vite.config.js vite.config.d.ts tsconfig.tsbuildinfo tsconfig.node.tsbuildinfo; do
            test ! -e "$artifact"
          done
      - name: Frontend unit tests
        env:
          EDGEWATCH_REPORT_ACT_WARNINGS: '1'
        run: npm run test:coverage
      - name: Frontend diff coverage
        run: node scripts/check-diff-coverage.mjs --language frontend --coverage coverage/coverage-final.json --base "${{ steps.release-lint-base.outputs.base }}" --require-base
      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-frontend-coverage
          if-no-files-found: error
          # Coverage reports are diagnostics for this run; keep them briefly.
          retention-days: 14
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/index.html
      - name: Remove stale Google Chrome apt source
        # Playwright installs Chromium and does not need the runner's Chrome repository.
        # Removing it avoids unrelated apt index hash mismatches during dependency setup.
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/edgewatch
      - name: Test
        run: |
          set -o pipefail
          go test -race -timeout=25m -coverprofile=coverage.out ./... | tee go-coverage-summary.txt
      - name: Check Go coverage
        run: ./scripts/check-go-coverage.sh coverage.out go-coverage-summary.txt
      - name: Go diff coverage
        run: node scripts/check-diff-coverage.mjs --language go --coverage coverage.out --base "${{ steps.release-lint-base.outputs.base }}" --require-base
      - name: Upload Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-go-coverage
          if-no-files-found: error
          # Coverage reports are diagnostics for this run; keep them briefly.
          retention-days: 14
          path: |
            coverage.out
            go-coverage-summary.txt
      - name: Remove generated coverage files before GoReleaser
        # GoReleaser refuses to build from a dirty worktree. Coverage files
        # are uploaded above, so remove the generated summary before the
        # packaging step while leaving source-controlled files untouched.
        run: rm -f go-coverage-summary.txt
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build release candidate archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Prepare binaries for the container build
        run: ./scripts/prepare-release-binaries.sh
      - name: Generate release manifest
        run: ./scripts/generate-release-manifest.sh "$GITHUB_REF_NAME"
      - name: Verify candidate artifacts
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          if-no-files-found: error
          # Later jobs in this run consume the candidate, and the published release
          # keeps its own copy of the assets. Seven days leaves room to re-run failed
          # jobs without storing every candidate for the repository default of 90 days.
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/release-manifest.json
            internal/webui/dist
            release-binaries

  binaries:
    name: Stage draft GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source for verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: .
      - name: Verify downloaded candidate
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Remove an abandoned draft from a previous attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' | head -n 1)"
          if [ -z "$release_id" ]; then
            exit 0
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          if [ "$(jq -r '.draft' <<<"$release_json")" = true ]; then
            # A smoke-failed attempt leaves only its private draft behind. It
            # is safe to replace that draft with the newly verified candidate;
            # a published release remains immutable and blocks the rerun.
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            echo "release $GITHUB_REF_NAME is already published; refusing a mixed rerun" >&2
            exit 1
          fi
      - name: Stage the verified release assets as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_args=(--draft --latest=false)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "EdgeWatch ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${release_args[@]}" \
            dist/*.tar.gz dist/checksums.txt dist/release-manifest.json
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

  image:
    name: Publish candidate GHCR image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    # Later jobs read the candidate from this output and never rebuild its
    # attempt-scoped tag: a partial re-run does not repeat this job, and GitHub
    # keeps its outputs, so the re-run tests and promotes this exact image.
    outputs:
      candidate: ${{ steps.candidate.outputs.reference }}
    env:
      # Each attempt of this job pushes a unique staging tag. This keeps a
      # rebuilt candidate independent of an earlier one while the public semver
      # tag remains absent until the candidate has passed every verification
      # step.
      CANDIDATE_IMAGE: ghcr.io/crypt0rr/edgewatch:candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: .
      - name: Verify downloaded candidate
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Candidate tags are attempt-scoped and are promoted to the
          # immutable semver tag only after the smoke job succeeds.
          tags: |
            type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=EdgeWatch
            org.opencontainers.image.description=Scheduled Nmap port monitoring with baseline change notifications
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      # The release candidate contains versioned Go binaries and generated
      # frontend assets. Refresh the release-only registry cache with these
      # exact inputs, then let the publishing build reuse this builder's cache.
      # Keep tag writes separate from main's cache and never write GHA caches.
      - name: Warm registry cache for the release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: |
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:buildcache
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:releasecache
          cache-to: type=registry,ref=ghcr.io/crypt0rr/edgewatch:releasecache,mode=max
          provenance: mode=max
          sbom: true
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          # The prebuilt binary and image labels carry the release version.
          # Keep the unused Dockerfile fallback arg aligned with CI's cache.
          build-args: |
            VERSION=v0.0.0-ci
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          # GitHub Actions caches are ref-isolated, so release tags restore
          # the main and release caches from GHCR instead of tag-scoped GHA.
          cache-from: |
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:buildcache
            type=registry,ref=ghcr.io/crypt0rr/edgewatch:releasecache
          provenance: mode=max
          sbom: true
      - name: Record the pushed candidate
        id: candidate
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the image build reported no manifest digest: '$DIGEST'" >&2
            exit 1
          fi
          # The digest pins the exact image index that smoke verifies and
          # promote-semver tags, whichever attempt those jobs run in.
          echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Verify published release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Draft releases are intentionally hidden from the contents: read API
      # surface. This job verifies the assets staged by the previous job
      # before the publication job makes the release public.
      contents: write
      packages: read
    steps:
      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$assets" -ge 4
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q 'checksums.txt'
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q 'release-manifest.json'
      - name: Check out source for release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node for frontend manifest verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Rebuild frontend for manifest verification
        run: npm ci && npm run build
      - name: Verify release archive versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern checksums.txt --pattern release-manifest.json --dir "$archive_dir"
          ./scripts/verify-release-artifacts.sh "$archive_dir" "$archive_dir/release-manifest.json" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          version="${GITHUB_REF_NAME#v}"
          expected="EdgeWatch $version"
          archives=("$archive_dir"/*.tar.gz)
          test -e "${archives[0]}"
          for archive in "${archives[@]}"; do
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            binary="$(find "$extract_dir" -type f -name edgewatch -print -quit)"
            test -n "$binary"
            # The release contains both AMD64 and ARM64 archives, while the
            # smoke runner is AMD64. Execute the native archive and inspect
            # the embedded version string for the non-native binary.
            if file -b "$binary" | grep -q 'x86-64'; then
              test "$("$binary" version)" = "$expected"
            else
              # Go stores the program name and version as separate constants,
              # so look for the exact version string in non-native binaries.
              strings "$binary" | grep -Fq "$version"
            fi
          done
      - name: Log in to GHCR for immutable image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and inspect the candidate image
        env:
          CANDIDATE: ${{ needs.image.outputs.candidate }}
        run: |
          digest="${CANDIDATE#"$REGISTRY_IMAGE@"}"
          if [ "$digest" = "$CANDIDATE" ] || [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the image job did not provide a digest-pinned candidate: '$CANDIDATE'" >&2
            exit 1
          fi
          image="$CANDIDATE"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker pull "$image"
          docker buildx imagetools inspect "$image" | tee image-manifest.txt
          grep -q 'linux/amd64' image-manifest.txt
          grep -q 'linux/arm64' image-manifest.txt
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$GITHUB_REF_NAME"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "AGPL-3.0-only"
          docker run --rm --entrypoint /bin/sh "$image" -c 'test -s /usr/share/licenses/edgewatch/LICENSE && test -s /usr/share/licenses/edgewatch/LICENSE.md && test -s /usr/share/licenses/edgewatch/THIRD_PARTY_LICENSES.md && test -s /usr/share/licenses/naabu/LICENSE.md'
      - name: Verify container runtime capability matrix
        run: ./scripts/verify-container-runtime.sh "$IMAGE"
      - name: Verify scanner sandbox with real scans
        run: ./scripts/verify-scanner-sandbox.sh "$IMAGE"
      - name: Verify binary version and configuration
        run: |
          expected="EdgeWatch ${GITHUB_REF_NAME#v}"
          test "$(docker run --rm "$IMAGE" version)" = "$expected"
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          ./scripts/prepare-container-smoke-data.sh "$IMAGE" "$smoke_dir/data"
          cleanup_smoke() {
            docker run --rm --volume "$smoke_dir/data:/data" --entrypoint /bin/sh "$IMAGE" -c 'rm -rf /data/* /data/.[!.]* /data/..?*' >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup_smoke EXIT
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          docker run --rm --read-only --tmpfs /tmp:size=128m,mode=1777 \
            --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges:true \
            -v "$smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            -v "$smoke_dir/data:/var/lib/edgewatch" \
            "$IMAGE" config validate --config /etc/edgewatch/config.yaml --output json
      - name: Verify embedded web assets and disposable SQLite state
        run: |
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          ./scripts/prepare-container-smoke-data.sh "$IMAGE" "$smoke_dir/data"
          container=""
          cleanup_smoke() {
            if [ -n "$container" ]; then
              docker stop "$container" >/dev/null 2>&1 || true
              docker rm "$container" >/dev/null 2>&1 || true
            fi
            docker run --rm --volume "$smoke_dir/data:/data" --entrypoint /bin/sh "$IMAGE" -c 'rm -rf /data/* /data/.[!.]* /data/..?*' >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup_smoke EXIT
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          container="$(docker run -d --network host --read-only --tmpfs /tmp:size=128m,mode=1777 \
            --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges:true \
            -v "$smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            -v "$smoke_dir/data:/var/lib/edgewatch" \
            "$IMAGE" daemon --config /etc/edgewatch/config.yaml)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ | grep -q 'EdgeWatch'; then
              break
            fi
            sleep 2
            if [ "$attempt" = 30 ]; then
              docker logs "$container"
              exit 1
            fi
          done
          docker exec "$container" edgewatch health --config /etc/edgewatch/config.yaml
          docker exec "$container" /bin/sh -c 'test -s /var/lib/edgewatch/edgewatch.db'
      - name: Verify disposable Compose deployment
        run: |
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          ./scripts/prepare-container-smoke-data.sh "$IMAGE" "$smoke_dir/data"
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          printf '%s\n' \
            'services:' \
            '  edgewatch:' \
            "    image: $IMAGE" \
            '    network_mode: host' \
            '    cap_drop:' \
            '      - ALL' \
            '    cap_add:' \
            '      - NET_RAW' \
            '    security_opt:' \
            '      - no-new-privileges:true' \
            '    read_only: true' \
            '    tmpfs:' \
            '      - /tmp:size=32m,mode=1777' \
            '    volumes:' \
            "      - $smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            "      - $smoke_dir/data:/var/lib/edgewatch:rw" > "$smoke_dir/compose.yaml"
          project="edgewatch-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -p "$project" -f "$smoke_dir/compose.yaml" down --volumes --remove-orphans >/dev/null 2>&1 || true
            docker run --rm --volume "$smoke_dir/data:/data" --entrypoint /bin/sh "$IMAGE" -c 'rm -rf /data/* /data/.[!.]* /data/..?*' >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT
          docker compose -p "$project" -f "$smoke_dir/compose.yaml" up -d --quiet-pull
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ | grep -q 'EdgeWatch'; then
              break
            fi
            sleep 2
            if [ "$attempt" = 30 ]; then
              docker compose -p "$project" -f "$smoke_dir/compose.yaml" logs
              exit 1
            fi
          done
          docker compose -p "$project" -f "$smoke_dir/compose.yaml" exec -T edgewatch edgewatch health --config /etc/edgewatch/config.yaml
          docker compose -p "$project" -f "$smoke_dir/compose.yaml" exec -T edgewatch /bin/sh -c "test -s /var/lib/edgewatch/edgewatch.db"
          cleanup
          trap - EXIT

  publish-release:
    name: Publish verified GitHub release
    needs: [binaries, image, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the staged draft after smoke verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub's tag-specific release endpoint hides draft releases. The
          # stage job intentionally creates a draft, so resolve its ID from
          # the authenticated release list before making it public.
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' | head -n 1)"
          test -n "$release_id"
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          # Publish the highest stable release as GitHub's "Latest" release.
          # Drafts and prereleases never participate, and an out-of-order tag
          # cannot displace a newer stable release already published.
          make_latest=false
          if [ "$prerelease" = false ]; then
            current_version="${GITHUB_REF_NAME#v}"
            highest_stable="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
            if [ -z "$highest_stable" ] || [ "$(printf '%s\n%s\n' "$highest_stable" "$current_version" | sort -V | tail -n 1)" = "$current_version" ]; then
              make_latest=true
            fi
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -f make_latest="$make_latest" >/dev/null

  promote-semver:
    name: Promote verified image to semver
    needs: [image, smoke, publish-release]
    if: ${{ needs.smoke.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote candidate after smoke verification
        env:
          CANDIDATE: ${{ needs.image.outputs.candidate }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          candidate_digest="${CANDIDATE#"$IMAGE@"}"
          if [ "$candidate_digest" = "$CANDIDATE" ] || [[ ! "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the image job did not provide a digest-pinned candidate: '$CANDIDATE'" >&2
            exit 1
          fi
          image_tag="${GITHUB_REF_NAME#v}"
          semver_image="$IMAGE:$image_tag"
          docker buildx imagetools inspect "$CANDIDATE" >/dev/null
          if existing="$(docker buildx imagetools inspect "$semver_image" --format '{{json .Manifest}}' 2>/dev/null)"; then
            # A re-run after this job created the tag but failed later finds
            # the verified candidate already promoted.
            if [ "$(jq -r '.digest' <<<"$existing")" = "$candidate_digest" ]; then
              echo "$semver_image already points to the verified candidate"
              exit 0
            fi
            echo "image tag already exists; refusing to overwrite $semver_image" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$semver_image" "$CANDIDATE"

  promote-latest:
    name: Promote verified image to latest
    needs: [promote-semver, publish-release]
    if: ${{ needs.promote-semver.result == 'success' && needs.publish-release.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote semver image after verification
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_tag="${GITHUB_REF_NAME#v}"
          highest_stable="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [ "$highest_stable" != "$image_tag" ]; then
            echo "${GITHUB_REF_NAME} is not the highest stable release; latest remains unchanged"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$image_tag"
