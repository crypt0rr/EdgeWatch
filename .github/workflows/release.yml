name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker image references must be lowercase even though GitHub repository
  # names may contain uppercase characters.
  REGISTRY_IMAGE: ghcr.io/crypt0rr/edgewatch
  NODE_VERSION: 24.21.0
  GORELEASER_VERSION: v2.18.0

jobs:
  # This is the only job that builds frontend assets and EdgeWatch binaries.
  # Downstream publication jobs consume its immutable artifact instead of
  # silently rebuilding with a different toolchain or source tree.
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.3.0 or v0.3.0-rc.1"
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release verification runs the same complete-change security gate
          # as pull requests; retain history so the merge base is available.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies and lint
        run: npm ci && npm run lint
      - name: Build frontend assets
        run: npm run build
      - name: Dependency and static-analysis checks
        env:
          GOLANGCI_LINT_BASE: ${{ github.event.before }}
        run: make security
      - name: Ensure frontend build leaves no TypeScript artifacts
        run: |
          for artifact in vite.config.js vite.config.d.ts tsconfig.tsbuildinfo tsconfig.node.tsbuildinfo; do
            test ! -e "$artifact"
          done
      - name: Frontend unit tests
        run: npm test
      - name: Remove stale Google Chrome apt source
        # Playwright installs Chromium and does not need the runner's Chrome repository.
        # Removing it avoids unrelated apt index hash mismatches during dependency setup.
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build release candidate archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Prepare binaries for the container build
        run: ./scripts/prepare-release-binaries.sh
      - name: Generate release manifest
        run: ./scripts/generate-release-manifest.sh "$GITHUB_REF_NAME"
      - name: Verify candidate artifacts
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/release-manifest.json
            internal/webui/dist
            release-binaries

  binaries:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source for verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: .
      - name: Verify downloaded candidate
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Refuse mixed or duplicate release publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to publish a mixed rerun" >&2
            exit 1
          fi
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "EdgeWatch ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt dist/release-manifest.json
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

  image:
    name: Publish GHCR image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: .
      - name: Verify downloaded candidate
        run: ./scripts/verify-release-artifacts.sh dist dist/release-manifest.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=EdgeWatch
            org.opencontainers.image.description=Scheduled Nmap port monitoring with baseline change notifications
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            PREBUILT_FRONTEND=1
            PREBUILT_EDGEWATCH=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Verify published release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$assets" -ge 4
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q 'checksums.txt'
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q 'release-manifest.json'
      - name: Check out source for release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release archive versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern checksums.txt --pattern release-manifest.json --dir "$archive_dir"
          ./scripts/verify-release-artifacts.sh "$archive_dir" "$archive_dir/release-manifest.json" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          version="${GITHUB_REF_NAME#v}"
          expected="EdgeWatch $version"
          archives=("$archive_dir"/*.tar.gz)
          test -e "${archives[0]}"
          for archive in "${archives[@]}"; do
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            binary="$(find "$extract_dir" -type f -name edgewatch -print -quit)"
            test -n "$binary"
            # The release contains both AMD64 and ARM64 archives, while the
            # smoke runner is AMD64. Execute the native archive and inspect
            # the embedded version string for the non-native binary.
            if file -b "$binary" | grep -q 'x86-64'; then
              test "$("$binary" version)" = "$expected"
            else
              # Go stores the program name and version as separate constants,
              # so look for the exact version string in non-native binaries.
              strings "$binary" | grep -Fq "$version"
            fi
          done
      - name: Log in to GHCR for immutable image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and inspect the semver image
        run: |
          image_tag="${GITHUB_REF_NAME#v}"
          image="${{ env.REGISTRY_IMAGE }}:${image_tag}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker pull "$image"
          docker buildx imagetools inspect "$image" | tee image-manifest.txt
          grep -q 'linux/amd64' image-manifest.txt
          grep -q 'linux/arm64' image-manifest.txt
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${GITHUB_REF_NAME#v}"
      - name: Verify container runtime capability matrix
        run: ./scripts/verify-container-runtime.sh "$IMAGE"
      - name: Verify binary version and configuration
        run: |
          expected="EdgeWatch ${GITHUB_REF_NAME#v}"
          test "$(docker run --rm "$IMAGE" version)" = "$expected"
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          # The disposable directory must also work on rootless Docker
          # runners, where container UID 0 is mapped away from the host user.
          chmod 0777 "$smoke_dir/data"
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          docker run --rm \
            -v "$smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            -v "$smoke_dir/data:/var/lib/edgewatch" \
            "$IMAGE" config validate --config /etc/edgewatch/config.yaml --output json
      - name: Verify embedded web assets and disposable SQLite state
        run: |
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          chmod 0777 "$smoke_dir/data"
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          container="$(docker run -d --network host \
            -v "$smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            -v "$smoke_dir/data:/var/lib/edgewatch" \
            "$IMAGE" daemon --config /etc/edgewatch/config.yaml)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ | grep -q 'EdgeWatch'; then
              break
            fi
            sleep 2
            if [ "$attempt" = 30 ]; then
              docker logs "$container"
              exit 1
            fi
          done
          docker exec "$container" edgewatch health --config /etc/edgewatch/config.yaml
          test -s "$smoke_dir/data/edgewatch.db"
      - name: Verify disposable Compose deployment
        run: |
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/data"
          chmod 0777 "$smoke_dir/data"
          printf '%s\n' \
            'database: /var/lib/edgewatch/edgewatch.db' \
            'retention: 24h' \
            'web:' \
            '  listen: 127.0.0.1:18080' \
            'scheduler:' \
            '  max_concurrent_scans: 1' \
            '  max_probe_count: 1000' \
            'notifications:' \
            '  urls: []' > "$smoke_dir/config.yaml"
          printf '%s\n' \
            'services:' \
            '  edgewatch:' \
            "    image: $IMAGE" \
            '    network_mode: host' \
            '    cap_drop:' \
            '      - ALL' \
            '    cap_add:' \
            '      - NET_RAW' \
            '    security_opt:' \
            '      - no-new-privileges:true' \
            '    read_only: true' \
            '    tmpfs:' \
            '      - /tmp:size=32m,mode=1777' \
            '    volumes:' \
            "      - $smoke_dir/config.yaml:/etc/edgewatch/config.yaml:ro" \
            "      - $smoke_dir/data:/var/lib/edgewatch:rw" > "$smoke_dir/compose.yaml"
          project="edgewatch-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -p "$project" -f "$smoke_dir/compose.yaml" down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose -p "$project" -f "$smoke_dir/compose.yaml" up -d --quiet-pull
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ | grep -q 'EdgeWatch'; then
              break
            fi
            sleep 2
            if [ "$attempt" = 30 ]; then
              docker compose -p "$project" -f "$smoke_dir/compose.yaml" logs
              exit 1
            fi
          done
          docker compose -p "$project" -f "$smoke_dir/compose.yaml" exec -T edgewatch edgewatch health --config /etc/edgewatch/config.yaml
          cleanup
          trap - EXIT
          test -s "$smoke_dir/data/edgewatch.db"

  promote-latest:
    name: Promote verified image to latest
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote semver image after verification
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          image_tag="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$image_tag"
