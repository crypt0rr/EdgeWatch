version: "2"

# Keep the initial CI gate focused on high-signal correctness checks. Existing
# findings are introduced incrementally: pull requests and local checks only
# report findings on the changes being reviewed.
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    # High-signal correctness checks are enabled explicitly so the suite is
    # deterministic across golangci-lint releases.  Keep the list narrow and
    # fix findings as they are introduced rather than carrying a blanket
    # repository-wide suppression backlog.
    - ineffassign
    - nilerr
    - nilnesserr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
