version: 2

builds:
  - id: edgewatch
    main: ./cmd/edgewatch
    binary: edgewatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Use the commit timestamp for binary and archive metadata so rebuilding
    # the same tag does not change the release checksum.
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
