services:
  edgewatch:
    image: ghcr.io/crypt0rr/edgewatch:latest
    container_name: edgewatch
    restart: unless-stopped
    # Bound the Docker json-file log so a noisy scanner or proxy cannot fill
    # the host filesystem. Increase these values only with an external log
    # retention plan.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Keep this above the daemon's six-minute graceful-shutdown join deadline;
    # large detailed snapshots may need the full persistence budget to commit.
    stop_grace_period: 7m
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./config.yaml:/etc/edgewatch/config.yaml:ro
      # Uncomment after creating notification-urls.txt and enabling urls_file in config.yaml.
      # - ./notification-urls.txt:/run/secrets/edgewatch-notification-urls:ro
      # Uncomment when using notifications.encryption_key_file in config.yaml.
      # - ./notification-encryption.key:/run/secrets/edgewatch-notification-key:ro
      - ./data:/var/lib/edgewatch:rw
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "edgewatch", "health", "--config", "/etc/edgewatch/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
