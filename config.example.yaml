database: /var/lib/edgewatch/edgewatch.db
retention: 90d

# Optional IANA timezone for this deployment. When set, daemon log timestamps,
# CLI status times, times in notification messages, and every signed-in web
# console follow it, and new jobs default to it. Omit it to keep UTC in the
# container and each browser's own timezone in the console. Each job still
# runs its schedule in its own timezone field.
# timezone: Europe/Amsterdam

# The administration UI is loopback-only. Access it on the Docker
# host at http://127.0.0.1:8080 or through an SSH tunnel.
web:
  listen: 127.0.0.1:8080
  # Optional host names accepted when the UI is reached through a reverse
  # proxy or tunnel. Loopback addresses and localhost are always accepted.
  # allowed_hosts: [edgewatch.example.com]
  # Trust only proxy addresses or networks that directly connect to EdgeWatch.
  # Only this one client-IP header is read; other forwarding headers are ignored.
  # The default is x-forwarded-for. Use forwarded only if your proxy controls it,
  # or none to ignore forwarding headers even when trusted proxies are configured.
  forwarded_header: x-forwarded-for
  # trusted_proxies: ["127.0.0.1/32"]
  # Optional separate key for encrypting the TOTP seed. The default is
  # ./data/auth.key; an explicit file must contain 32 raw bytes or 64 hex
  # characters, be mode 0600, and be mounted into the container.
  # auth_key_file: /run/secrets/edgewatch-auth-key

scheduler:
  max_concurrent_scans: 1
  # Approximate Nmap probes permitted per run unless an administrator enables
  # high-cost work for a job. Naabu has a separate budget below because its
  # full-range discovery probes are much lighter than Nmap probes.
  max_probe_count: 5000000
  # Naabu 1-65535 discovery budget. The default covers the editor's 256-host
  # expansion limit (about 16.8M probes) with headroom.
  max_naabu_probe_count: 20000000

# Structured daemon logs are emitted as JSON on stdout. Other CLI commands
# write the same log to stderr so their printed result stays on stdout. Use
# debug while diagnosing a request, or warn/error to reduce routine output.
# The default is info.
log:
  level: info

# EdgeWatch uses host networking for scanner reachability. By default it
# refuses loopback and link-local targets, including cloud metadata addresses.
# Set target_exclusions: [] only when an administrator has deliberately
# accepted the risk and needs to monitor the host's own local surface.
scanner:
  target_exclusions:
    - 127.0.0.0/8
    - 169.254.0.0/16
    - ::1/128
    - fe80::/10

# Check the latest stable GitHub release at startup and every three hours.
# Set enabled: false for offline or privacy-sensitive deployments. A check
# reveals the host's public IP and EdgeWatch user agent to GitHub.
updates:
  enabled: true

# Opening a public host in the console performs an on-demand RDAP lookup.
# Set enabled: false for isolated or privacy-sensitive deployments.
enrichment:
  rdap:
    enabled: true

notifications:
  # Prefer a regular, owner-readable (0400 or 0600) file with one Shoutrrr
  # URL per line. Symlinks and files larger than 1 MiB are rejected at startup.
  # Changing any part of a URL (for example a rotated token) creates a new
  # destination; select it again for each job in the web console.
  # urls_file: /run/secrets/edgewatch-notification-urls
  # Web-managed destinations are encrypted with ./data/notification.key.
  # To supply the key separately (for example as a Docker secret), set this
  # to a file containing 32 raw bytes or 64 hexadecimal characters, mode 0600.
  # encryption_key_file: /run/secrets/edgewatch-notification-key
  urls: []

# Jobs are created and scheduled from the web interface. YAML jobs from older
# releases are intentionally not imported; they remain inactive with a
# startup warning so they can be recreated and reviewed explicitly.
